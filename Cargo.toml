[package]
name = "jlrs-ledger"
version = "0.4.0"
edition = "2024"
authors = ["Thomas van Doornmalen <thomas.vandoornmalen@gmail.com>"]
description = "A ledger to track Julia data borrowed in Rust"
homepage = "https://github.com/Taaitaaiger/jlrs_ledger"
repository = "https://github.com/Taaitaaiger/jlrs_ledger"
readme = "./README.md"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex"] }

[target.'cfg(unix)'.dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[profile.bench]
debug = true
codegen-units = 1
lto = "thin"

[profile.release]
codegen-units = 1
panic = "abort"
lto = "thin"

[[bench]]
name = "track"
harness = false

[[bench]]
name = "contention"
harness = false
